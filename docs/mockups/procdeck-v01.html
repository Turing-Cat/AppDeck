:root[data-theme=&quot;light&quot;] {

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );

    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))

  padding: 5px;

  background: transparent !important;

  text-decoration: none;
  text-underline-offset: 2px;

a:is(:hover, :focus-visible) {

  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;

h2,
h3,
h4,
h5,
h6,

}

h3,

}

b,

.table-responsive {

  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {

  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {

}

.table thead th {

  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {

}

}

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;

.card {

  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );

  border-radius: var(--radius-lg);

  color: var(--popover-foreground);
  background: var(--popover);

  align-items: center;
  gap: 10px;
}

  border: 0;

  border: 0;

  color: var(--accent-foreground);

.text-muted {

}

.tabular-nums {

}

.sr-only {

  clip: rect(0, 0, 0, 0);

}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;

  gap: 2px 12px;
  margin-bottom: 0;

.btn:not(:disabled):hover {

  opacity: 0.4;

  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {

  }

  .form-control-color[type=&quot;color&quot;] {

  }

    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;

  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {

  max-width: 100%;
  height: auto;

#widget &gt; svg {

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  flex: none;
  margin: 0 !important;

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;procdeck-v01-mockup&#x27;);
      const apps = [
        { name: &#x27;Brave&#x27;, appId: &#x27;brave-browser&#x27;, icon: &#x27;globe-2&#x27;, windows: 4, workspaces: [&#x27;1&#x27;, &#x27;3&#x27;], title: &#x27;ProcDeck — Brave&#x27; },
        { name: &#x27;Visual Studio Code&#x27;, appId: &#x27;code&#x27;, icon: &#x27;code-2&#x27;, windows: 2, workspaces: [&#x27;2&#x27;], title: &#x27;ProcDeck / README.md&#x27; },
        { name: &#x27;Alacritty&#x27;, appId: &#x27;Alacritty&#x27;, icon: &#x27;terminal-square&#x27;, windows: 3, workspaces: [&#x27;1&#x27;, &#x27;4&#x27;], title: &#x27;zjh@omarchy: ~/Projects/ProcDeck&#x27; },
        { name: &#x27;Firefox&#x27;, appId: &#x27;firefox&#x27;, icon: &#x27;compass&#x27;, windows: 1, workspaces: [&#x27;4&#x27;], title: &#x27;Omarchy Shell Plugins&#x27; },
        { name: &#x27;Spotify&#x27;, appId: &#x27;spotify&#x27;, icon: &#x27;music-2&#x27;, windows: 1, workspaces: [&#x27;5&#x27;], title: &#x27;Now Playing&#x27; }
      ];

      const search = root.querySelector(&#x27;#pd-search&#x27;);
      const list = root.querySelector(&#x27;#pd-list&#x27;);
      const count = root.querySelector(&#x27;#pd-count&#x27;);
      const status = root.querySelector(&#x27;#pd-status&#x27;);
      const confirm = root.querySelector(&#x27;#pd-confirm&#x27;);
      let selectedId = apps[0].appId;

      const visibleApps = () =&gt; {
        const query = search.value.trim().toLowerCase();
        return apps.filter(app =&gt; [app.name, app.appId, app.title].join(&#x27; &#x27;).toLowerCase().includes(query));
      };

      const selectedApp = () =&gt; visibleApps().find(app =&gt; app.appId === selectedId) || visibleApps()[0] || null;

      const refreshIcons = () =&gt; {
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      };

      const renderDetail = () =&gt; {
        const app = selectedApp();
        const detail = root.querySelector(&#x27;#pd-detail&#x27;);
        detail.hidden = !app;
        if (!app) return;
        selectedId = app.appId;
        root.querySelector(&#x27;#pd-detail-name&#x27;).textContent = app.name;
        root.querySelector(&#x27;#pd-detail-id&#x27;).textContent = app.appId;
        root.querySelector(&#x27;#pd-detail-title&#x27;).textContent = app.title + &#x27; · workspace &#x27; + app.workspaces.join(&#x27;, &#x27;);
        root.querySelector(&#x27;#pd-detail-icon&#x27;).setAttribute(&#x27;data-lucide&#x27;, app.icon);
      };

      const render = () =&gt; {
        const visible = visibleApps();
        const totalWindows = visible.reduce((sum, app) =&gt; sum + app.windows, 0);
        count.textContent = visible.length + &#x27; apps · &#x27; + totalWindows + &#x27; windows&#x27;;
        if (!visible.some(app =&gt; app.appId === selectedId) &amp;&amp; visible.length) selectedId = visible[0].appId;

        if (!visible.length) {
          list.innerHTML = &#x27;&lt;div class=&quot;pd-empty&quot;&gt;No matching applications&lt;/div&gt;&#x27;;
          renderDetail();

        list.innerHTML = visible.map(app =&gt; `
          &lt;button type=&quot;button&quot; class=&quot;pd-app-row&quot; role=&quot;option&quot; aria-selected=&quot;${app.appId === selectedId}&quot; data-app-id=&quot;${app.appId}&quot;&gt;

              &lt;span class=&quot;pd-app-meta&quot;&gt;&lt;span class=&quot;pd-secondary&quot;&gt;workspace&lt;/span&gt;${app.workspaces.map(workspace =&gt; `&lt;span class=&quot;pd-workspace&quot;&gt;${workspace}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/span&gt;
            &lt;/span&gt;
            &lt;span class=&quot;pd-window-count&quot;&gt;${app.windows} ${app.windows === 1 ? &#x27;window&#x27; : &#x27;windows&#x27;}&lt;/span&gt;
          &lt;/button&gt;

        list.querySelectorAll(&#x27;.pd-app-row&#x27;).forEach(row =&gt; {

        renderDetail();
        refreshIcons();
      };

      const removeSelected = action =&gt; {
        const app = selectedApp();
        if (!app) return;
        const index = apps.findIndex(item =&gt; item.appId === app.appId);
        apps.splice(index, 1);
        selectedId = visibleApps()[Math.min(index, Math.max(visibleApps().length - 1, 0))]?.appId || &#x27;&#x27;;
        status.textContent = action + &#x27; · &#x27; + app.name;
        render();
      };

      const moveSelection = delta =&gt; {
        const visible = visibleApps();
        if (!visible.length) return;
        const current = Math.max(0, visible.findIndex(app =&gt; app.appId === selectedId));
        selectedId = visible[(current + delta + visible.length) % visible.length].appId;
        render();

      const askForceKill = () =&gt; {
        const app = selectedApp();

      search.addEventListener(&#x27;input&#x27;, render);
      root.querySelector(&#x27;#pd-focus&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const app = selectedApp();
        if (app) status.textContent = &#x27;Focused · &#x27; + app.name;

      root.querySelector(&#x27;#pd-close&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; removeSelected(&#x27;Closed&#x27;));
      root.querySelector(&#x27;#pd-kill&#x27;).addEventListener(&#x27;click&#x27;, askForceKill);
      root.querySelector(&#x27;#pd-cancel-kill&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        confirm.hidden = true;
        search.focus();
      });
      root.querySelector(&#x27;#pd-confirm-kill&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        confirm.hidden = true;
        removeSelected(&#x27;Force killed&#x27;);
        search.focus();

      root.addEventListener(&#x27;keydown&#x27;, event =&gt; {
        if (!confirm.hidden) {

            event.preventDefault();

          moveSelection(event.key === &#x27;ArrowUp&#x27; ? -1 : 1);
        } else if (event.key === &#x27;Enter&#x27;) {

          if (app) status.textContent = &#x27;Focused · &#x27; + app.name;
        } else if (event.key === &#x27;Delete&#x27; &amp;&amp; event.shiftKey) {
          event.preventDefault();
          askForceKill();
        } else if (event.key === &#x27;Delete&#x27;) {
          event.preventDefault();
          removeSelected(&#x27;Closed&#x27;);
        } else if (event.key === &#x27;Escape&#x27;) {
          if (search.value) {
            search.value = &#x27;&#x27;;
            render();
          } else {
            status.textContent = &#x27;Dismissed preview&#x27;;
          }
        }
      });

      render();
      refreshIcons();
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;

  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

    clearOpenTimeout();
    pinnedByTouch = false;

    autoUpdateCleanup?.();

    floating.style.transform = &quot;translate(0, 0)&quot;;

    setDescribedBy(trigger, true);

    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);

    }

      trigger == null ||

    window.setTimeout(() =&gt; {

    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {

    lastPointerWasTouch = false;

    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
